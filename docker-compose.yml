name: ${COMPOSE_PROJECT_NAME:-minecraft-forge-server}

services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile.Server
      args:
        JAVA_VERSION: "${JAVA_VERSION:?Set JAVA_VERSION in .env}"
    ports:
      - "${SERVER_PORT:-25565}:25565"
    volumes:
      - ./data:/data
    environment:
      EULA: "${EULA:-false}"
      SERVER_START_SCRIPT: "${SERVER_START_SCRIPT:-run.sh}"
      TZ: "${TZ:-UTC}"
    stdin_open: true
    tty: true
    stop_signal: SIGINT
    stop_grace_period: 120s
