name: ${COMPOSE_PROJECT_NAME:-minecraft-forge-server}

services:
  forge:
    image: itzg/minecraft-server:java${JAVA_VERSION:?Set JAVA_VERSION in .env}
    ports:
      - "${SERVER_PORT:-25565}:25565"
    volumes:
      - ./data:/data
    environment:
      EULA: "${EULA:-false}"
      TYPE: FORGE
      VERSION: "${MC_VERSION:?Set MC_VERSION to the server pack Minecraft version}"
      FORGE_VERSION: "${FORGE_VERSION:?Set FORGE_VERSION to the server pack Forge version}"
      MEMORY: "${MEMORY:-4G}"
      TZ: "${TZ:-UTC}"
      OVERRIDE_SERVER_PROPERTIES: "false"
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 5
